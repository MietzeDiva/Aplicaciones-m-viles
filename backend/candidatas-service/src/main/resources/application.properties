spring.application.name=candidatas-service
server.port=8081

# Base de datos MySQL/MariaDB (XAMPP). La base debe existir: crearla en phpMyAdmin.
spring.datasource.url=jdbc:mariadb://localhost:3306/wim100
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
